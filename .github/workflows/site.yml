name: Publicar site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  schedule:
    - cron: "17 */3 * * *"   # de 3 em 3 horas: atualiza a disponibilidade
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias
        run: pip install -q pillow pillow-heif google-auth requests
      - uses: actions/cache@v4
        with:
          path: .cache/fotos
          key: fotos-${{ github.run_id }}
          restore-keys: fotos-
      - name: Fotografias (Google Drive, sem EXIF/GPS)
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: python site/tools/fotos.py
      - name: Sincronizar disponibilidade (iCal)
        env:
          ICAL_AIRBNB: ${{ secrets.ICAL_AIRBNB }}
          ICAL_BOOKING: ${{ secrets.ICAL_BOOKING }}
        run: python site/tools/sync_ical.py
      - name: Preparar ficheiros públicos
        run: |
          mkdir -p _site
          rsync -a --exclude tools/ site/ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
